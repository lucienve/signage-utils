<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Gold Key Specials</title>
    <link rel="stylesheet" href="menu.css">
</head>

<body>

    <header>
        <h1>Jimmy's Lakeside Pizza</h1>
        <div class="header-right">
            <div class="sub-header">Specials this Week</div>
            <div id="expiration-date" class="expiration-date"></div>
        </div>
    </header>

    <div class="menu-container" id="menu-board">
        <div class="loading">Loading Menu...</div>
    </div>

    <script>
        const API_URL = 'menu_proxy.php';

        async function init() {
            try {
                const req = await fetch(API_URL);
                if (!req.ok) throw new Error("API Error");
                const data = await req.json();
                render(data.values || []);
            } catch (e) {
                console.error(e);
                document.getElementById('menu-board').innerHTML =
                    `<div class="loading">Menu Unavailable</div>`;
            }
        }

        function render(rows) {
            const container = document.getElementById('menu-board');
            container.innerHTML = '';

            // 1. Sort items into buckets
            const lunch = [];
            const soups = [];
            const salads = [];
            const apps = [];
            const entrees = [];
            const desserts = [];
            let expirationDate = null;
            let isExpired = false;

            rows.forEach(row => {
                // [0]Category, [1]Name, [2]Price, [3]Description
                const category = (row[0] || "").trim().toLowerCase();
                if (!row[1]) return;

                if (category === 'expiration') {
                    expirationDate = row[1];
                    const parsedDate = new Date(expirationDate);
                    if (!isNaN(parsedDate)) {
                        // Obtain the current time correctly mapped to Milford, PA
                        const nowInMilford = new Date(new Date().toLocaleString("en-US", { timeZone: "America/New_York" }));

                        // Treat the parsed date as if it is in Milford's local time as well, and set it to the end of that day.
                        parsedDate.setHours(23, 59, 59, 999);

                        if (nowInMilford > parsedDate) {
                            isExpired = true;
                        }
                    }
                    return;
                }

                const item = {
                    name: row[1],
                    price: cleanPrice(row[2]),
                    desc: row[3] || ""
                };

                if (category === 'lunch') lunch.push(item);
                else if (category === 'soup') soups.push(item);
                else if (category === 'salad') salads.push(item);
                else if (category === 'appetizer') apps.push(item);
                else if (category === 'entree') entrees.push(item);
                else if (category === 'dessert') desserts.push(item);
            });

            // Update expiration date if present
            const dateElement = document.getElementById('expiration-date');
            if (dateElement) {
                dateElement.textContent = expirationDate ? `Valid until ${expirationDate}` : '';
            }

            // 2. Check content availability
            const hasLunch = lunch.length > 0;
            const hasSoups = soups.length > 0;
            const hasSalads = salads.length > 0;
            const hasApps = apps.length > 0;
            const hasEntrees = entrees.length > 0;
            const hasDesserts = desserts.length > 0;

            // Left column handles Lunch + Starters
            const hasLeftContent = hasLunch || hasSoups || hasSalads || hasApps;

            // Right column handles Entrees + Desserts
            const hasRightContent = hasEntrees || hasDesserts;

            // 3. Handle Empty Menu or Expired Menu
            if ((!hasLeftContent && !hasRightContent) || isExpired) {
                container.innerHTML = `<div class="full-width">Please ask your server for this week's specials.</div>`;
                return;
            }

            // 4. Build HTML Layout
            let html = '';

            // LEFT COLUMN (Lunch, Soups, Salads, Apps)
            const leftClass = hasLeftContent ? 'menu-col' : 'menu-col hidden-col';

            html += `<div class="${leftClass}">`;
            if (hasLunch) {
                html += `
                <div class="menu-section">
                    <div class="section-title">Lunch Specials</div>
                    ${generateList(lunch)}
                </div>`;
            }
            if (hasSoups) {
                html += `
                <div class="menu-section">
                    <div class="section-title">Soups</div>
                    ${generateList(soups)}
                </div>`;
            }
            if (hasSalads) {
                html += `
                <div class="menu-section">
                    <div class="section-title">Salads</div>
                    ${generateList(salads)}
                </div>`;
            }
            if (hasApps) {
                html += `
                <div class="menu-section">
                    <div class="section-title">Appetizers</div>
                    ${generateList(apps)}
                </div>`;
            }
            html += `</div>`; // End Left Col

            // RIGHT COLUMN (Entrees, Desserts)
            const rightClass = hasRightContent ? 'menu-col' : 'menu-col hidden-col';

            html += `<div class="${rightClass}">`;
            if (hasEntrees) {
                html += `
                <div class="menu-section">
                    <div class="section-title">Entrees</div>
                    ${generateList(entrees)}
                </div>`;
            }
            if (hasDesserts) {
                html += `
                <div class="menu-section">
                    <div class="section-title">Desserts</div>
                    ${generateList(desserts)}
                </div>`;
            }
            html += `</div>`; // End Right Col

            container.innerHTML = html;
        }

        function generateList(items) {
            return items.map(item => `
            <div class="menu-item">
                <div class="item-header">
                    <span class="item-name">${item.name}</span>
                    <span class="item-price">${item.price}</span>
                </div>
                ${item.desc ? `<div class="item-desc">${item.desc}</div>` : ''}
            </div>
        `).join('');
        }

        function cleanPrice(p) {
            if (!p) return "";
            p = p.toString().trim();
            if (!p.startsWith('$') && !isNaN(parseFloat(p))) return '$' + p;
            return p;
        }

        init();
    </script>
</body>

</html>
