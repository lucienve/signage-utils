<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Gold Key Events - Billboard</title>
    <link rel="stylesheet" href="events.css">
</head>

<body>

    <header>
        <h1>Upcoming Events</h1>
    </header>

    <div id="event-list">
        <div class="no-events">Loading...</div>
    </div>

    <script>
        const API_URL = 'events_proxy.php';

        async function init() {
            try {
                const req = await fetch(API_URL);
                if (!req.ok) throw new Error("API Error");
                const data = await req.json();
                render(data.items || []);
            } catch (e) {
                document.getElementById('event-list').innerHTML = `<div class="no-events">No Events Loaded</div>`;
            }
        }

        function render(events) {
            const container = document.getElementById('event-list');
            container.innerHTML = '';

            if (events.length === 0) {
                container.innerHTML = '<div class="no-events">No events this week.</div>';
                return;
            }

            // Show MAX 3 events
            events.slice(0, 3).forEach(evt => {
                const title = evt.summary;
                let start = evt.start.dateTime || evt.start.date;
                let isAllDay = !evt.start.dateTime;
                const dateObj = new Date(start);

                const dayName = dateObj.toLocaleDateString('en-US', { weekday: 'short' });
                const dayNum = dateObj.getDate();

                // Location Logic
                let rawLoc = evt.location || "Gold Key";
                // Clean simple locations (e.g. "Lounge, 123 Main St" -> "Lounge")
                let location = rawLoc.split(',')[0];

                let timeStr = "All Day";
                if (!isAllDay) {
                    timeStr = dateObj.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).replace(' M', '').toLowerCase();
                }

                const html = `
                <div class="event-card">
                    <div class="event-date-box">
                        <div class="date-day">${dayName}</div>
                        <div class="date-num">${dayNum}</div>
                    </div>
                    <div class="event-details">
                        <div class="event-title">${title}</div>
                        <div class="event-meta">
                            <div class="event-time">${timeStr}</div>
                            <div class="event-loc">📍 ${location}</div>
                        </div>
                    </div>
                </div>
            `;
                container.innerHTML += html;
            });
        }
        init();
    </script>
</body>

</html>
