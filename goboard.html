<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>GoBoard</title>
    <link rel="stylesheet" href="goboard.css">
</head>

<body>

    <div class="sign-container">
        <div class="line" id="line1"></div>
        <div class="line" id="line2"></div>
        <div class="line" id="line3"></div>
    </div>

    <script>
        async function fetchSignData() {
            try {
                const urlParams = new URLSearchParams(window.location.search);

                let fetchUrl = 'goboard_proxy.php';
                if (urlParams.has('clear')) {
                    fetchUrl += '?clear';
                }

                const response = await fetch(fetchUrl);
                if (!response.ok) throw new Error('Failed to fetch data');

                const data = await response.json();

                if (data.values && data.values.length > 0) {
                    const row = data.values[0];
                    updateLine('line1', row[0] || '');
                    updateLine('line2', row[1] || '');
                    updateLine('line3', row[2] || '');
                }
            } catch (error) {
                console.error("Error fetching GoBoard data:", error);
            }
        }

        function updateLine(id, text) {
            const el = document.getElementById(id);
            if (el) {
                el.innerText = text;
                el.style.display = text.trim() === '' ? 'none' : 'block';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchSignData();
            // Fetch every 15 minutes (900000 ms)
            setInterval(fetchSignData, 15 * 60 * 1000);
        });
    </script>
</body>

</html>
