<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>GoBoard</title>
    <link rel="stylesheet" href="goboard.css">
</head>

<body>

    <div class="sign-container">
        <img id="logo" src="logo.png" alt="Gold Key Logo">
        <div class="line" id="line1"></div>
        <div class="line" id="line2"></div>
        <div class="line" id="line3"></div>
    </div>

    <script>
        let messagesList = [];
        let currentIndex = 0;
        let displayTimer = null;

        async function fetchSignData() {
            try {
                const urlParams = new URLSearchParams(window.location.search);

                let fetchUrl = 'goboard_proxy.php';
                if (urlParams.has('clear')) {
                    fetchUrl += '?clear';
                }

                const response = await fetch(fetchUrl);
                if (!response.ok) throw new Error('Failed to fetch data');

                const data = await response.json();

                if (data.values && data.values.length > 0) {
                    messagesList = data.values;

                    // If we just loaded for the first time, start the loop immediately
                    if (!displayTimer) {
                        currentIndex = 0;
                        showNextMessage();
                    }
                } else {
                    messagesList = [];
                }
            } catch (error) {
                console.error("Error fetching GoBoard data:", error);
            }
        }

        function showNextMessage() {
            if (displayTimer) {
                clearTimeout(displayTimer);
                displayTimer = null;
            }

            if (!messagesList || messagesList.length === 0) {
                // Keep trying to retry if data is empty or hasn't loaded
                displayTimer = setTimeout(showNextMessage, 5000);
                return;
            }

            // Ensure index is within bounds (e.g., if array shrank during refresh)
            if (currentIndex >= messagesList.length) {
                currentIndex = 0;
            }

            const row = messagesList[currentIndex];
            const firstCell = (row[0] || '').trim();

            const logoEl = document.getElementById('logo');
            const lines = ['line1', 'line2', 'line3'];

            if (firstCell === '<LOGO>') {
                // Hide text lines, show logo
                lines.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.style.display = 'none';
                });
                if (logoEl) logoEl.style.display = 'block';
            } else {
                // Hide logo, show/update text lines
                if (logoEl) logoEl.style.display = 'none';
                updateLine('line1', row[0] || '');
                updateLine('line2', row[1] || '');
                updateLine('line3', row[2] || '');
            }

            // Parse duration from column 4 (index 3). Fallback to 10s if invalid.
            let durationSeconds = 10;
            if (row.length > 3 && row[3]) {
                const parsed = parseFloat(row[3]);
                if (!isNaN(parsed) && parsed > 0) {
                    durationSeconds = parsed;
                }
            }

            // Move to the next index for the next cycle
            currentIndex = (currentIndex + 1) % messagesList.length;

            displayTimer = setTimeout(showNextMessage, durationSeconds * 1000);
        }

        function updateLine(id, text) {
            const el = document.getElementById(id);
            if (el) {
                el.innerText = text;
                el.style.display = text.trim() === '' ? 'none' : 'block';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchSignData();
            // Refetch data every 15 minutes (900000 ms) in the background
            setInterval(fetchSignData, 15 * 60 * 1000);
        });
    </script>
</body>

</html>
