<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Garbage Schedule</title>
    <link rel="stylesheet" href="garbage_day.css">
</head>

<body>

    <header>
        <h1>Next Garbage Pickup</h1>
    </header>

    <div class="container">
        <div id="day-val" class="day-display">--</div>
        <div id="date-val" class="date-display">Loading...</div>

        <div id="delay-box" class="delay-msg">
            ⚠️ Delayed for <span id="reason-val">Holiday</span>
        </div>

        <div class="note" id="note-val"></div>
    </div>

    <script>
        async function init() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                let fetchUrl = 'garbage_day_proxy.php';
                if (urlParams.has('clear')) {
                    fetchUrl += '?clear';
                    if (urlParams.has('token')) {
                        fetchUrl += '&token=' + encodeURIComponent(urlParams.get('token'));
                    }
                }

                const req = await fetch(fetchUrl);
                const data = await req.json();
                render(data);
            } catch (e) {
                document.getElementById('date-val').innerText = "Offline";
            }
        }

        function render(data) {
            const dayEl = document.getElementById('day-val');
            const boxEl = document.getElementById('delay-box');

            // 1. Set Text
            dayEl.innerText = data.day_name;
            document.getElementById('date-val').innerText = data.pickup_date;
            document.getElementById('note-val').innerText = data.instructions;

            // 2. Handle Color & Warning
            if (data.is_delayed) {
                dayEl.className = "day-display c-delayed"; // Orange
                boxEl.style.display = "inline-block";      // Show Warning
                document.getElementById('reason-val').innerText = data.reason;
            } else {
                dayEl.className = "day-display c-normal";  // Green
                boxEl.style.display = "none";
            }
        }

        init();
    </script>
</body>

</html>
