<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Gold Key Weather - Billboard</title>
    <link rel="stylesheet" href="weather_live.css">
</head>

<body>
    <header>
        <h1>Current Conditions in Gold Key</h1>
        <div class="timestamp" id="last-updated">--:--</div>
    </header>

    <div class="dashboard">
        <div class="main-col">
            <div class="temp-huge" id="val-temp">--&deg;</div>
            <div class="feels-like" id="lbl-feels">Feels Like <span id="val-feels">--</span>&deg;</div>
        </div>

        <div class="sensor-col">
            <div class="stat-row">
                <div class="stat-label">Wind</div>
                <div class="stat-val c-wind">
                    <span id="val-wind">--</span><span class="unit">MPH</span>
                </div>
            </div>
            <div class="stat-row">
                <div class="stat-label">Rain</div>
                <div class="stat-val c-rain">
                    <span id="val-rain">--</span><span class="unit">IN</span>
                </div>
            </div>
            <div class="stat-row">
                <div class="stat-label">Humidity</div>
                <div class="stat-val c-humid">
                    <span id="val-humid">--</span><span class="unit">%</span>
                </div>
            </div>
            <div class="stat-row">
                <div class="stat-label">Air Quality</div>
                <div class="stat-val">
                    <span id="val-aqi">--</span><span class="unit">AQI</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_WX = 'weather_proxy.php';
        const API_AQI = 'purpleair_proxy.php';

        // Helpers
        const toF = (c) => (c * 9 / 5) + 32;
        const toMph = (ms) => (ms * 2.23694).toFixed(0);
        const toInches = (mm) => (mm * 0.0393701).toFixed(2);

        async function init() {
            Promise.all([
                fetch(API_WX).then(r => r.json()).catch(e => null),
                fetch(API_AQI).then(r => r.json()).catch(e => null)
            ]).then(([wxData, aqiData]) => {
                if (wxData) renderWeather(wxData);
                if (aqiData) renderAQI(aqiData);
            });
        }

        function renderWeather(data) {
            if (!data.obs || !data.obs[0]) return;
            const obs = data.obs[0];

            const temp = Math.round(toF(obs.air_temperature));
            const wind = toMph(obs.wind_avg);
            const rain = toInches(obs.precip_accum_local_day);
            const humid = obs.relative_humidity;

            // --- DYNAMIC FEELS LIKE LOGIC ---
            let feelVal = obs.feels_like;
            let feelLabel = "Feels Like";

            if (obs.air_temperature <= 10) {
                if (obs.wind_chill !== undefined && obs.wind_chill !== null) {
                    feelVal = obs.wind_chill;
                    feelLabel = "Wind Chill";
                }
            }
            else if (obs.air_temperature >= 27) {
                if (obs.heat_index !== undefined && obs.heat_index !== null) {
                    feelVal = obs.heat_index;
                    feelLabel = "Heat Index";
                }
            }

            const feelF = Math.round(toF(feelVal));

            document.getElementById('val-temp').innerHTML = temp + "&deg;";
            document.getElementById('lbl-feels').innerHTML = `${feelLabel} <span id="val-feels">${feelF}</span>&deg;`;

            document.getElementById('val-wind').innerText = wind;
            document.getElementById('val-rain').innerText = rain;
            document.getElementById('val-humid').innerText = humid;

            const date = new Date(obs.timestamp * 1000);
            document.getElementById('last-updated').innerText = date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        }

        function renderAQI(data) {
            if (!data.sensor) return;
            const pm25 = data.sensor["pm2.5_atm"];
            const aqi = calculateAQI(pm25);

            const el = document.getElementById('val-aqi');
            el.innerText = aqi;

            el.className = "";
            if (aqi <= 50) el.classList.add("aqi-good");
            else if (aqi <= 100) el.classList.add("aqi-mod");
            else if (aqi <= 150) el.classList.add("aqi-sens");
            else el.classList.add("aqi-bad");
        }

        function calculateAQI(pm) {
            if (pm === undefined || pm === null) return "--";
            if (pm > 350.5) return calc(pm, 500, 401, 500, 350.5);
            if (pm > 250.5) return calc(pm, 400, 301, 350.4, 250.5);
            if (pm > 150.5) return calc(pm, 300, 201, 250.4, 150.5);
            if (pm > 55.5) return calc(pm, 200, 151, 150.4, 55.5);
            if (pm > 35.5) return calc(pm, 150, 101, 55.4, 35.5);
            if (pm > 12.1) return calc(pm, 100, 51, 35.4, 12.1);
            if (pm >= 0) return calc(pm, 50, 0, 12.0, 0);
            return 0;
        }
        function calc(Cp, Ih, Il, BPh, BPl) {
            return Math.round(((Ih - Il) / (BPh - BPl)) * (Cp - BPl) + Il);
        }

        init();
    </script>
</body>

</html>
