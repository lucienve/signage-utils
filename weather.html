<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Gold Key Weather Board</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            background: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }

        h1 {
            font-size: 3em;
            margin: 0 0 20px 0;
            border-bottom: 2px solid #444;
            padding-bottom: 20px;
        }

        /* Views */
        .view {
            display: none;
            height: 100%;
        }

        .visible {
            display: block;
        }

        /* FORECAST Styles */
        .forecast-container {
            display: flex;
            gap: 20px;
            height: 85%;
        }

        .period-card {
            flex: 1;
            background: #333;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            /* justify-content: space-between; */
            position: relative;
            overflow: hidden;
        }

        .period-card.is-night {
            background: #101c2e;
            border: 1px solid #2c3e50;
        }

        /* Top Section (Expands to fill space) */
        .period-top {
            flex-grow: 1;
            /* Takes all available space */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .period-name {
            font-size: 2.2em;
            color: #4facfe;
            margin-bottom: 10px;
            font-weight: bold;
            width: 100%;
        }

        .is-night .period-name {
            color: #8ca6db;
        }

        .period-icon {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            margin-bottom: 5px;
        }

        .period-temp {
            font-size: 6em;
            font-weight: bold;
            margin: 0;
            line-height: 1;
        }

        .period-rain {
            font-size: 1.8em;
            color: #6dd5fa;
            font-weight: bold;
            margin: 10px 0;
            min-height: 1.2em;
        }

        /* Made larger since we have more room now */
        .period-desc {
            font-size: 2em;
            color: #ddd;
            font-weight: 500;
            margin-bottom: 10px;
            line-height: 1.1;
        }

        .period-wind {
            font-size: 1.2em;
            color: #888;
            font-style: italic;
            margin-bottom: 15px;
        }

        /* Detailed Forecast (Smaller fixed area) */
        .period-detailed {
            height: 25%;
            /* Fixed to ~1/4 of card height */
            flex-shrink: 0;
            font-size: 1.05em;
            color: #bbb;
            line-height: 1.35;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            /* Clips text if it's absurdly long */
        }

        /* Alert Styles */
        .alert-active-bg {
            background-color: #3e0a0a !important;
        }

        .alert-container {
            display: flex;
            flex-direction: column;
            height: 85%;
            overflow: hidden;
            position: relative;
        }

        .alert-box {
            background: #d32f2f;
            color: white;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
        }

        .alert-header {
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .alert-title {
            font-size: 3em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .alert-meta {
            font-size: 1.5em;
            opacity: 0.8;
            margin-top: 10px;
        }

        .alert-content {
            font-size: 1.8em;
            line-height: 1.4;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 10px;
        }

        .scroll-wrapper {
            animation: auto-scroll 40s linear infinite;
        }

        @keyframes auto-scroll {
            0% {
                transform: translateY(0);
            }

            10% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-100%);
            }
        }

        .no-alerts {
            text-align: center;
            font-size: 3em;
            color: #555;
            margin-top: 20%;
        }
    </style>
</head>

<body>

    <div id="view-forecast" class="view">
        <h1>Gold Key Weather Forecast</h1>
        <div class="forecast-container" id="forecast-grid"></div>
    </div>

    <div id="view-alerts" class="view">
        <h1>Active Weather Alerts</h1>
        <div id="alerts-wrapper" class="alert-container"></div>
    </div>

    <script>
        const LAT = 41.323;
        const LON = -74.802;

        const urlParams = new URLSearchParams(window.location.search);
        const viewMode = urlParams.get('view') || 'forecast';
        document.getElementById('view-' + viewMode).classList.add('visible');

        async function initWeather() {
            try {
                const pointsReq = await fetch(`https://api.weather.gov/points/${LAT},${LON}`);
                const pointsData = await pointsReq.json();
                const forecastUrl = pointsData.properties.forecast;

                const forecastReq = await fetch(forecastUrl);
                const forecastData = await forecastReq.json();
                const periods = forecastData.properties.periods;

                if (viewMode === 'forecast') renderForecast(periods);
                if (viewMode === 'alerts') renderAlerts(LAT, LON);

            } catch (e) {
                console.error("Weather data failed", e);
                if (document.body.innerText.trim() === "") {
                    document.body.innerHTML = "<h1>Weather Unavailable</h1><p>Check Internet Connection</p>";
                }
            }
        }

        function renderForecast(periods) {
            const grid = document.getElementById('forecast-grid');
            const nextThree = periods.slice(0, 3);

            nextThree.forEach(p => {
                const isNight = !p.isDaytime;
                const cardClass = isNight ? 'period-card is-night' : 'period-card';
                const iconUrl = p.icon;
                const precipVal = p.probabilityOfPrecipitation.value;
                const precipHtml = precipVal ? `Chance of Precip: ${precipVal}%` : '';

                grid.innerHTML += `
                <div class="${cardClass}">
                    <div class="period-top">
                        <div class="period-name">${p.name}</div>
                        <img src="${iconUrl}" class="period-icon" alt="Weather Icon">
                        <div class="period-temp">${p.temperature}&deg;</div>
                        <div class="period-rain">${precipHtml}</div>
                        <div class="period-desc">${p.shortForecast}</div>
                        <div class="period-wind">Wind: ${p.windSpeed} ${p.windDirection}</div>
                    </div>
                    <div class="period-detailed">${p.detailedForecast}</div>
                </div>
            `;
            });
        }

        async function renderAlerts(lat, lon) {
            const alertsReq = await fetch(`https://api.weather.gov/alerts/active?point=${lat},${lon}`);
            const alertsData = await alertsReq.json();
            const wrapper = document.getElementById('alerts-wrapper');

            if (alertsData.features.length === 0) {
                wrapper.innerHTML = '<div class="no-alerts">No Active Alerts for Gold Key Area</div>';
            } else {
                document.body.classList.add('alert-active-bg');
                let htmlContent = '<div class="scroll-wrapper">';

                alertsData.features.forEach(alert => {
                    const props = alert.properties;
                    const expires = new Date(props.expires).toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit' });

                    let fullText = props.description || "";
                    if (props.instruction) {
                        fullText += "\n\n*** INSTRUCTION ***\n" + props.instruction;
                    }

                    htmlContent += `
                    <div class="alert-box">
                        <div class="alert-header">
                            <div class="alert-title">${props.event}</div>
                            <div class="alert-meta">Expires: ${expires} | Severity: ${props.severity}</div>
                        </div>
                        <div class="alert-content">${fullText}</div>
                    </div>
                `;
                });
                htmlContent += '</div>';
                wrapper.innerHTML = htmlContent;
            }
        }

        initWeather();
        setTimeout(() => window.location.reload(), 600000); 
    </script>
</body>

</html>
