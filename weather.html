<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Gold Key Weather Board</title>
    <link rel="stylesheet" href="weather.css">
</head>

<body>

    <div id="view-forecast" class="view">
        <h1>Gold Key Weather Forecast</h1>
        <div class="forecast-container" id="forecast-grid"></div>
    </div>

    <div id="view-alerts" class="view">
        <h1>Active Weather Alerts</h1>
        <div id="alerts-wrapper" class="alert-container"></div>
    </div>

    <script>
        const LAT = 41.323;
        const LON = -74.802;

        const urlParams = new URLSearchParams(window.location.search);
        const viewMode = urlParams.get('view') || 'forecast';
        document.getElementById('view-' + viewMode).classList.add('visible');

        async function initWeather() {
            try {
                const pointsReq = await fetch(`https://api.weather.gov/points/${LAT},${LON}`);
                const pointsData = await pointsReq.json();
                const forecastUrl = pointsData.properties.forecast;

                const forecastReq = await fetch(forecastUrl);
                const forecastData = await forecastReq.json();
                const periods = forecastData.properties.periods;

                if (viewMode === 'forecast') renderForecast(periods);
                if (viewMode === 'alerts') renderAlerts(LAT, LON);

            } catch (e) {
                console.error("Weather data failed", e);
                if (document.body.innerText.trim() === "") {
                    document.body.innerHTML = "<h1>Weather Unavailable</h1><p>Check Internet Connection</p>";
                }
            }
        }

        function renderForecast(periods) {
            const grid = document.getElementById('forecast-grid');
            const nextThree = periods.slice(0, 3);

            nextThree.forEach(p => {
                const isNight = !p.isDaytime;
                const cardClass = isNight ? 'period-card is-night' : 'period-card';
                const iconUrl = p.icon;
                const precipVal = p.probabilityOfPrecipitation.value;
                const precipHtml = precipVal ? `Chance of Precip: ${precipVal}%` : '';

                grid.innerHTML += `
                <div class="${cardClass}">
                    <div class="period-top">
                        <div class="period-name">${p.name}</div>
                        <img src="${iconUrl}" class="period-icon" alt="Weather Icon">
                        <div class="period-temp">${p.temperature}&deg;</div>
                        <div class="period-rain">${precipHtml}</div>
                        <div class="period-desc">${p.shortForecast}</div>
                        <div class="period-wind">Wind: ${p.windSpeed} ${p.windDirection}</div>
                    </div>
                    <div class="period-detailed">${p.detailedForecast}</div>
                </div>
            `;
            });
        }

        async function renderAlerts(lat, lon) {
            const alertsReq = await fetch(`https://api.weather.gov/alerts/active?point=${lat},${lon}`);
            const alertsData = await alertsReq.json();
            const wrapper = document.getElementById('alerts-wrapper');

            if (alertsData.features.length === 0) {
                wrapper.innerHTML = '<div class="no-alerts">No Active Alerts for Gold Key Area</div>';
            } else {
                document.body.classList.add('alert-active-bg');
                let htmlContent = '<div class="scroll-wrapper">';

                alertsData.features.forEach(alert => {
                    const props = alert.properties;
                    const expires = new Date(props.expires).toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit' });

                    let fullText = props.description || "";
                    if (props.instruction) {
                        fullText += "\n\n*** INSTRUCTION ***\n" + props.instruction;
                    }

                    htmlContent += `
                    <div class="alert-box">
                        <div class="alert-header">
                            <div class="alert-title">${props.event}</div>
                            <div class="alert-meta">Expires: ${expires} | Severity: ${props.severity}</div>
                        </div>
                        <div class="alert-content">${fullText}</div>
                    </div>
                `;
                });
                htmlContent += '</div>';
                wrapper.innerHTML = htmlContent;
            }
        }

        initWeather();
        setTimeout(() => window.location.reload(), 600000); 
    </script>
</body>

</html>
