name: Deploy via FTP
on:
  workflow_run:
    workflows: ["Tests"]
    types:
      - completed
    branches:
      - main

jobs:
  Deploy:
    name: Deploy to Web Host
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          server-dir: /public_html/signage/
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          dry-run: true
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            tests/**
            **/.env
            **/phpunit.xml
            **/package.json
            **/package-lock.json
            **/node_modules/**
            .ftpignore
            LICENSE
            MANIFEST.md
            **/composer.*
