name: Deploy via FTP
on:
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  Deploy:
    name: Deploy to Web Host
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      
      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          server-dir: ${{ secrets.FTP_DIR }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          dry-run: false
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            tests/**
            **/.env
            **/phpunit.xml
            **/package.json
            **/package-lock.json
            **/node_modules/**
            .ftpignore
            LICENSE
            MANIFEST.md
            **/composer.*
